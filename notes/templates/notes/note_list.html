<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notes</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; color: #222; }
        form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        input[type="text"] { flex: 1; padding: 0.5rem; font-size: 1rem; }
        button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { padding: 0.5rem 0; border-bottom: 1px solid #eee; }
        .stats { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <h1>Notes</h1>
    <p class="stats">
        {{ note_count }} note{{ note_count|pluralize }} in Postgres &middot;
        {{ page_views }} page view{{ page_views|pluralize }} counted in Redis
    </p>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="text" placeholder="Write a note..." autofocus required maxlength="280">
        <button type="submit">Add</button>
    </form>
    <ul>
        {% for note in notes %}
            <li>{{ note.text }} <small>&mdash; {{ note.created_at }}</small></li>
        {% empty %}
            <li>No notes yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
